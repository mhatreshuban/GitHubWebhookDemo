
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Webhook Automation</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 45px;
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #00e5ff;
            font-size: 30px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            background: #00e5ff;
            color: #141e30;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #00bcd4;
        }

        #result {
            color: #64ffda;
            font-weight: bold;
            margin-top: 25px;
        }

        .status {
            margin-top: 25px;
            font-size: 14px;
            color: #b0bec5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GitHub Webhook CI/CD Automation</h1>

        <p>
            Welcome to the GitHub Webhook Automation Project!
        </p>

        <p>
            This project demonstrates how GitHub Webhooks
            automatically trigger Jenkins CI/CD pipelines
            whenever code is pushed to GitHub.
        </p>

        <button onclick="showMessage()">
            Test Automation
        </button>

        <p id="result"></p>

        <div class="status">
            GitHub | Jenkins | Webhooks | DevOps
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
